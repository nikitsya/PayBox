{% extends "layout.html" %}

{% block content %}
<section class="rental-screen">
    <a class="brand-link" href="{{ url_for('home') }}">PayBox</a>
    <h1>Create account</h1>
    <form id="registration-form" action="{{ url_for('register') }}" method="post">
        <div class="field registration-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password"
                   minlength="15" maxlength="128" aria-describedby="password-help" required>
        </div>
        <p class="field-help" id="password-help">Use 15–128 characters.</p>
        <button class="confirm-button" id="register-button" type="submit">Create account</button>
        <p class="confirmation" id="registration-message" role="status" aria-live="polite" aria-atomic="true"></p>
        <noscript><p class="confirmation">Please enable JavaScript to create an account.</p></noscript>
    </form>
    <a class="back-button" href="{{ url_for('home') }}">Back to lockers</a>
</section>
<script defer src="{{ url_for('static', path='js/registration.js') }}"></script>
{% endblock content %}
