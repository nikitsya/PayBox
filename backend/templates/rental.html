{% extends "layout.html" %}

{% block content %}
<section class="rental-screen">
    <a class="brand-link" href="{{ url_for('home') }}">PayBox</a>
    <h1>{{ locker.name }}</h1>
    <form id="rental-form" data-price-cents="{{ locker.price_per_day_cents }}" novalidate>
        <div class="field">
            <label for="days">Number of days</label>
            <input id="days" name="days" type="number" inputmode="numeric" min="1" max="7" step="1" required aria-describedby="days-help">
        </div>
        <p id="days-help" class="field-help" aria-live="polite">Rent for up to 7 days</p>
        <p>Price per day: €{{ '%.2f' | format(locker.price_per_day_cents / 100) }}</p>
        <p class="total" aria-live="polite" aria-atomic="true">Total price: <output id="total" for="days">€0.00</output></p>
        <button id="confirm" class="confirm-button" type="submit" disabled>Confirm rental</button>
        <p id="confirmation" class="confirmation" role="status" hidden></p>
    </form>
    <a class="back-button" href="{{ url_for('home') }}">Back</a>
</section>
{% endblock content %}
